[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world


[gcode_shell_command shutdown_host]
command: shutdown now

[delayed_gcode shutdown_machine]
gcode:
    RUN_SHELL_COMMAND CMD=shutdown_host
initial_duration: 0.0

[menu __main __poweroff]
type: command
enable: {printer.idle_timeout.state != "Printing"}
name: Turn off Pi
gcode:
    M117 Shutdown_RPI
    { menu.exit() }
    UPDATE_DELAYED_GCODE ID=shutdown_machine DURATION=1

[gcode_macro turn_off_camera]
gcode:
  RUN_SHELL_COMMAND CMD=turn_off_camera_script

[gcode_shell_command turn_off_camera_script]
command: /bin/systemctl stop mjpg-streamer.service
timeout: 5
verbose: True